# 노트북이 꺼져 있어도 도는 부분: 발행과 성과 기록. LLM은 여기 없다 — 글·카드는 PC 루틴(run_local.bat)이 만든다.
name: publish
on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 발행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python publish.py
      - name: 성과
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python publish.py --insights
      - name: 저장
        if: always()
        run: |
          git config user.name "robot-carousel bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A slides data
          git diff --cached --quiet || git commit -m "publish: $(date -u +%F' '%H:%M)"
          git pull --rebase && git push
